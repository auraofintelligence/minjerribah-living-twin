<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minjerribah Living Twin</title>
<meta name="description" content="A living digital twin of Minjerribah / North Stradbroke Island: civic planning, island life, events, stewardship, and the works below the sand.">
<link rel="stylesheet" href="src/ui/design.css">
<link rel="stylesheet" href="src/ui/ui.css">
</head>
<body>
<div id="boot">
  <div class="boot-inner">
    <div class="boot-mark">MINJERRIBAH</div>
    <div class="boot-sub">Living Twin</div>
    <div class="boot-bar"><i id="boot-bar-fill"></i></div>
    <div class="boot-status" id="boot-status">waking the island</div>
    <!-- Verbatim from data/lore.json acknowledgement.game_wording.short, which names the loading
         screen as where it belongs. It is repeated here rather than fetched because this markup is
         on screen before any pack has loaded. If the pack changes, change this line with it: the
         pack is the record and this is a copy. The earlier wording here was neither the short nor
         the long text and had drifted on its own. -->
    <div class="boot-ack">Minjerribah is Quandamooka Country. We acknowledge the Quandamooka People as Traditional Owners, and pay respect to Elders past and present.</div>
  </div>
</div>

<canvas id="stage" touch-action="none"></canvas>
<div id="ui-root"></div>

<script src="vendor/babylon.js"></script>
<script src="vendor/babylon.gui.js"></script>
<script src="vendor/babylon.materials.js"></script>
<!-- glTF and GLB loading. Vendored so a contributed scan can actually enter the world: docs/CAPTURE-CONTRACT.md
     described a pipeline the build could not execute, because nothing here could read a GLB. See docs/BUILDINGS.md. -->
<script src="vendor/babylon.loaders.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
